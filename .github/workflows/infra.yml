name: Infra checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build lightweight services
        run: docker compose build mock-llm dashboard gateway
      - name: Python syntax (mock LLM)
        run: python3 -m py_compile mock-llm/server.py
      - name: Mock LLM smoke test
        run: |
          python3 mock-llm/server.py &
          sleep 1
          curl -sf http://localhost:11434/healthz
          curl -sf -X POST http://localhost:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-llm","messages":[{"role":"user","content":"ci"}]}' | grep -q choices
          kill %1
