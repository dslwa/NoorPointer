name: Java checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noorpointer_test
          POSTGRES_USER: noor
          POSTGRES_PASSWORD: noorpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noor -d noorpointer_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: controlplane/pom.xml
      - name: Build and test
        working-directory: controlplane
        run: ./mvnw --batch-mode verify
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: controlplane/target/surefire-reports/
