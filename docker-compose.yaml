services:
  # ========================================================
  # DATA PLANE & PROXY (Go Gateway)
  # ========================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: noorpointer-gateway
    ports:
      - "8080:8080" # OpenAI-compatible Reverse Proxy
      - "9090:9090" # Prometheus Metrics (/metrics)
    environment:
      - PORT=8080
      - METRICS_PORT=9090
      - REDIS_URL=redis://redis:6379/0
      - SEMANTIC_URL=http://semantic-service:8001
      - SEMANTIC_GRPC_URL=semantic-service:50051
      - CONTROLPLANE_URL=http://controlplane:8082
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - UPSTREAM_LLM_URL=http://mock-llm:11434
      - POLICY_FILE=/app/config/policy.yaml
      - SIGNATURES_FEED_URL=http://signatures-feed:8085/signatures.json
      - JWT_PUBLIC_KEY=/etc/noorpointer/jwt.pub
    volumes:
      - ./config/policy.yaml:/app/config/policy.yaml:ro
      - ./gateway/keys/jwt.pub:/etc/noorpointer/jwt.pub:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
      semantic-service:
        condition: service_started
      signatures-feed:
        condition: service_started
      controlplane:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # AI GUARDRAILS (Python DeBERTa v3, GLiNER Zero-Shot NER, Picklescan RCE via gRPC :50051)
  # ========================================================
  semantic-service:
    build:
      context: ./semantic-service
      dockerfile: Dockerfile
    container_name: noorpointer-semantic
    ports:
      - "8001:8001" # FastAPI HTTP API & /metrics
      - "50051:50051" # gRPC GuardrailService (Protobuf v3)
    environment:
      - PORT=8001
      - GRPC_PORT=50051
      - OLLAMA_URL=http://mock-llm:11434
      - GUARD_MODEL=llama-guard3:1b
      - TORCH_THREADS=4
      - PYTHONUNBUFFERED=1
    depends_on:
      mock-llm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # CONTROL PLANE (Policy Catalog, PostgreSQL Audit, SIEM CEF Export & Dashboard API)
  # ========================================================
  controlplane:
    build:
      context: .
      dockerfile: controlplane/Dockerfile
    container_name: noorpointer-controlplane
    ports:
      - "8082:8082" # REST API /api/v1
    environment:
      - PORT=8082
      - SERVER_ADDRESS=0.0.0.0
      - DATABASE_URL=jdbc:postgresql://postgres:5432/noorpointer?currentSchema=controlplane
      - DATABASE_USER=noor
      - DATABASE_PASSWORD=noorpass
      - SPRING_FLYWAY_SCHEMAS=controlplane
      - SPRING_FLYWAY_DEFAULT_SCHEMA=controlplane
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - DEMO_ENABLED=${DEMO_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      signatures-feed:
        condition: service_started
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # MANAGEMENT & SECURITY DASHBOARD (HTML/CSS/JavaScript + Nginx API proxy)
  # ========================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: noorpointer-dashboard
    ports:
      - "3000:3000"
    depends_on:
      controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # THREAT INTELLIGENCE FEED (External CVEs / Signatures)
  # ========================================================
  signatures-feed:
    image: nginx:alpine
    container_name: noorpointer-signatures-feed
    ports:
      - "8085:8085"
    volumes:
      - ./singatures-feed:/usr/share/nginx/html:ro
      - ./singatures-feed/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # INFRASTRUCTURE STORAGE (PostgreSQL 16 JSONB & Redis 7 Token Bucket)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: noorpointer-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: noor
      POSTGRES_PASSWORD: noorpass
      POSTGRES_DB: noorpointer
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noor -d noorpointer"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - noorpointer-net

  redis:
    image: redis:7-alpine
    container_name: noorpointer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # MOCK LLM UPSTREAM (OpenAI- + Ollama-compatible, zero deps)
  # Swap for real Ollama/OpenAI later via UPSTREAM_LLM_URL / OLLAMA_URL.
  # ========================================================
  mock-llm:
    build:
      context: ./mock-llm
      dockerfile: Dockerfile
    container_name: noorpointer-mock-llm
    ports:
      - "11434:11434" # drop-in for the old ollama port (curl debugging)
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # TELEMETRY & OBSERVABILITY (Prometheus & Grafana)
  # ========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: noorpointer-prometheus
    ports:
      - "9091:9090" # Zewnętrzny 9091 (unikamy konfliktu z gateway:9090)
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./telemetry/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    networks:
      - noorpointer-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: noorpointer-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - noorpointer-net

  # ========================================================
  # EVALUATION & AUTOMATION PROFILES (Tests & Benchmarks)
  # ========================================================
  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: noorpointer-tests
    environment:
      - GATEWAY_URL=http://gateway:8080
      - CONTROLPLANE_URL=http://controlplane:8082
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - SEMANTIC_URL=http://semantic-service:8001
    volumes:
      - ./reports:/app/reports
    profiles:
      - tests
    networks:
      - noorpointer-net

  benchmarks:
    image: grafana/k6:latest
    container_name: noorpointer-benchmarks
    volumes:
      - ./benchmarks:/benchmarks
      - ./reports:/reports
    environment:
      - TARGET_URL=http://gateway:8080
    profiles:
      - bench
    networks:
      - noorpointer-net

networks:
  noorpointer-net:
    driver: bridge

volumes:
  postgres-data:
