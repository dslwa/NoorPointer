# Caly system: kazda usluga to osobny kontener. Blok x-service ustawia wspolne rzeczy:
# restart po awarii, jedna siec i rotacje logow (max 10 MB x 3 pliki na usluge).
x-service: &service
  restart: unless-stopped
  networks: [noorpointer-net]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Brama (Go): sprawdza token, model i tresc, potem przekazuje pytanie do modelu.
  gateway:
    mem_limit: 512m
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: noorpointer-gateway
    ports:
      - "8080:8080" # pytania w formacie OpenAI
      - "9090:9090" # metryki (na razie nieuzywane)
    environment:
      - PORT=8080
      - METRICS_PORT=9090
      - REDIS_URL=redis://redis:6379/0
      - SEMANTIC_URL=http://semantic-service:8001
      - SEMANTIC_GRPC_URL=semantic-service:50051
      - CONTROLPLANE_URL=http://controlplane:8082
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - UPSTREAM_LLM_URL=http://mock-llm:11434
      - SIGNATURES_FEED_URL=http://signatures-feed:8085/signatures.json
      - JWT_PUBLIC_KEY=/app/keys/jwt.pub
    volumes:
      - ./gateway/keys/jwt.pub:/app/keys/jwt.pub:ro,z
    healthcheck:
      # 127.0.0.1, nie "localhost": BusyBox wget probuje IPv6, a brama slucha tylko IPv4.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
      semantic-app:
        condition: service_started
      signatures-feed:
        condition: service_started
      controlplane:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    <<: *service

  # Kontrole AI (Python): szuka prob ataku i danych osobowych. Nie ma wlasnych portow,
  # bo dziala w wielu kopiach za load balancerem nizej (latwo ja skalowac).
  semantic-app:
    mem_limit: 4g
    build:
      context: ./semantic-service
      dockerfile: Dockerfile
    environment:
      - PORT=8001
      - GRPC_PORT=50051
      - OLLAMA_URL=http://mock-llm:11434
      - GUARD_MODEL=llama-guard3:1b
      # Zasada strojenia: repliki x PI_WORKERS x TORCH_THREADS <= liczba watkow CPU.
      - TORCH_THREADS=${TORCH_THREADS:-4}
      - PI_WORKERS=${PI_WORKERS:-2}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    depends_on:
      mock-llm:
        condition: service_healthy
    <<: *service

  # Rozdziela ruch miedzy kopie uslugi AI i udaje jeden adres "semantic-service".
  semantic-lb:
    mem_limit: 256m
    image: nginx:1.30-alpine
    container_name: noorpointer-semantic-lb
    ports:
      - "8001:8001" # HTTP: skany i metryki
      - "50051:50051" # gRPC dla bramy
    volumes:
      - ./telemetry/nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./telemetry/nginx-lb/conf.d:/etc/nginx/conf.d:ro,z
      - ./telemetry/nginx-lb/stream.d:/etc/nginx/stream.d:ro,z
    networks:
      noorpointer-net:
        aliases:
          - semantic-service
    healthcheck:
      # 127.0.0.1 z tego samego powodu co w bramie (BusyBox wget i IPv6).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8001/lb-healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      semantic-app:
        condition: service_healthy
    <<: *service

  # Zasady bezpieczenstwa, lista sygnatur, dziennik zdarzen i API panelu (Java).
  controlplane:
    mem_limit: 2g
    build:
      context: .
      dockerfile: controlplane/Dockerfile
    container_name: noorpointer-controlplane
    ports:
      - "8082:8082" # REST API /api/v1
    environment:
      - PORT=8082
      - SERVER_ADDRESS=0.0.0.0
      - DATABASE_URL=jdbc:postgresql://postgres:5432/noorpointer?currentSchema=controlplane
      - DATABASE_USER=noor
      - DATABASE_PASSWORD=noorpass
      - GATEWAY_URL=http://gateway:8080
      - SPRING_FLYWAY_SCHEMAS=controlplane
      - SPRING_FLYWAY_DEFAULT_SCHEMA=controlplane
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - DEMO_ENABLED=${DEMO_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      signatures-feed:
        condition: service_started
    <<: *service

  # Panel w przegladarce: incydenty, zasady, sygnatury i budzety (React + Nginx).
  dashboard:
    mem_limit: 256m
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: noorpointer-dashboard
    ports:
      - "3000:3000"
    depends_on:
      controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *service

  # Podaje liste znanych atakow (sygnatury) jako plik JSON.
  signatures-feed:
    mem_limit: 128m
    image: nginx:1.30-alpine
    container_name: noorpointer-signatures-feed
    ports:
      - "8085:8085"
    volumes:
      - ./signatures-feed:/usr/share/nginx/html:ro,z
      - ./signatures-feed/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/signatures.json"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *service

  # Baza danych: audyt i zasady. Dane zostaja w wolumenie miedzy restartami.
  postgres:
    mem_limit: 1g
    image: postgres:16-alpine
    container_name: noorpointer-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: noor
      POSTGRES_PASSWORD: noorpass
      POSTGRES_DB: noorpointer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noor -d noorpointer"]
      interval: 3s
      timeout: 3s
      retries: 5
    <<: *service

  # Szybki licznik zuzycia dla budzetow.
  redis:
    mem_limit: 256m
    image: redis:7-alpine
    container_name: noorpointer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    <<: *service

  # Zastepczy model: udaje LLM w formacie OpenAI i Ollama, zeby dzialac bez internetu.
  mock-llm:
    mem_limit: 512m
    build:
      context: ./mock-llm
      dockerfile: Dockerfile
    container_name: noorpointer-mock-llm
    ports:
      - "11434:11434" # ten sam port co Ollama, latwo podmienic
    <<: *service

  # Prometheus zbiera liczby z uslug, Grafana rysuje z nich wykresy.
  prometheus:
    mem_limit: 512m
    image: prom/prometheus:v2.54.1
    container_name: noorpointer-prometheus
    ports:
      - "9091:9090" # na zewnatrz 9091, bo 9090 zajmuje brama
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./telemetry/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro,z
      # Tokenu nie wpisujemy w pliku konfiguracji, tylko w osobnym pliku (robi go make up).
      - ./telemetry/.prometheus-admin-token:/etc/prometheus/admin_token:ro,z
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle" # pozwala przeladowac reguly bez restartu
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    <<: *service

  grafana:
    mem_limit: 512m
    image: grafana/grafana:11.1.0
    container_name: noorpointer-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus
    <<: *service

  # Testy i pomiary. Nie startuja przy "make up" - tylko na zawolanie (profile).
  tests:
    mem_limit: 512m
    build:
      context: ./tests
      dockerfile: Dockerfile
    environment:
      - GATEWAY_URL=http://gateway:8080
      - CONTROLPLANE_URL=http://controlplane:8082
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - SEMANTIC_URL=http://semantic-service:8001
    volumes:
      # Test montujemy z repozytorium, zeby zmiana pliku dzialala bez przebudowy obrazu.
      - ./tests/test_guardrails.py:/app/test_guardrails.py:ro,z
      - ./reports:/app/reports:z
    profiles:
      - tests
    networks: [noorpointer-net]

  benchmarks:
    mem_limit: 512m
    image: grafana/k6:2.3.0
    volumes:
      - ./benchmarks:/benchmarks:z
      - ./reports:/reports:z
    environment:
      - TARGET_URL=http://gateway:8080
    profiles:
      - bench
    networks: [noorpointer-net]

  # Testy uslugi AI (Python, pytest) na kodzie z repozytorium.
  semantic-tests:
    mem_limit: 4g
    build:
      context: ./semantic-service
      dockerfile: Dockerfile
    working_dir: /app
    # Obraz dziala jako uzytkownik "semantic", ale ten serwis dopisuje biblioteki do /app/.venv,
    # ktore nalezy do roota - dlatego tutaj swiadomie wracamy do roota.
    user: root
    volumes:
      - ./semantic-service/tests:/app/tests:ro,z
    environment:
      - MODELS_OFFLINE=1
      - OLLAMA_URL=http://mock-llm:11434
      - GUARD_MODEL=llama-guard3:1b
      - PYTHONUNBUFFERED=1
    command:
      - sh
      - -c
      - uv sync --frozen --dev --no-install-project && python -m pytest tests -q --tb=no
    depends_on:
      mock-llm:
        condition: service_healthy
    profiles:
      - semantic
    networks: [noorpointer-net]

  # Testy modulu Java (Maven) na osobnej bazie, zeby nie ruszyc danych z pokazu.
  controlplane-tests:
    mem_limit: 2g
    build:
      context: .
      dockerfile: controlplane/Dockerfile
      target: build
    working_dir: /workspace
    command:
      - mvn
      - -B
      - -ntp
      - -f
      - controlplane/pom.xml
      - test
      - -Dfrontend.skip=true
    environment:
      - TEST_DATABASE_URL=jdbc:postgresql://postgres:5432/noorpointer_test?currentSchema=controlplane_test
      - TEST_DATABASE_USER=noor
      - TEST_DATABASE_PASSWORD=noorpass
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - java
    networks: [noorpointer-net]

networks:
  noorpointer-net:
    driver: bridge

volumes:
  postgres-data:
