# Wspolne ustawienia serwisow dlugotrwalych (restart + siec). Serwisy jednorazowe
# (tests, benchmarks) ustawiaja tylko siec - bez restart policy.
x-service: &service
  restart: unless-stopped
  networks: [noorpointer-net]
  # Rotacja logow: bez tego json-file rosnie bez limitu na dlugo dzialajacym stosie.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ========================================================
  # DATA PLANE & PROXY (Go Gateway)
  # ========================================================
  gateway:
    mem_limit: 512m
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: noorpointer-gateway
    ports:
      - "8080:8080" # OpenAI-compatible Reverse Proxy
      - "9090:9090" # Prometheus Metrics (/metrics)
    environment:
      - PORT=8080
      - METRICS_PORT=9090
      - REDIS_URL=redis://redis:6379/0
      - SEMANTIC_URL=http://semantic-service:8001
      - SEMANTIC_GRPC_URL=semantic-service:50051
      - CONTROLPLANE_URL=http://controlplane:8082
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - UPSTREAM_LLM_URL=http://mock-llm:11434
      - SIGNATURES_FEED_URL=http://signatures-feed:8085/signatures.json
      - JWT_PUBLIC_KEY=/app/keys/jwt.pub
    volumes:
      - ./gateway/keys/jwt.pub:/app/keys/jwt.pub:ro,z
    healthcheck:
      # 127.0.0.1, nie localhost - BusyBox wget potrafi wybrac ::1 (ta sama pulapka co w semantic-lb).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
      semantic-app:
        condition: service_started
      signatures-feed:
        condition: service_started
      controlplane:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    <<: *service

  # ========================================================
  # AI GUARDRAILS (Python DeBERTa v3, Presidio NER, Llama Guard, Picklescan RCE via gRPC :50051)
  # ========================================================
  # Usluga skalowalna: `make scale REPLIKI=3` podnosi liczbe tych kontenerow.
  # Nie publikuje portow (robiloby to konflikt przy drugiej replice) i nie ma nazwy kontenera -
  # ruch z zewnatrz wchodzi przez load balancer `semantic-lb` ponizej.
  semantic-app:
    mem_limit: 4g
    build:
      context: ./semantic-service
      dockerfile: Dockerfile
    environment:
      - PORT=8001
      - GRPC_PORT=50051
      - OLLAMA_URL=http://mock-llm:11434
      - GUARD_MODEL=llama-guard3:1b
      # Strojenie pod procesor. Wzgorze: repliki x PI_WORKERS x TORCH_THREADS <= liczba watkow CPU.
      # Na tej maszynie (8 watkow) uklad domyslny 1x2x4 wykorzystuje ja co do watku, wiec dokladanie
      # replik bez zmniejszenia tych dwoch liczb tylko dlawi procesor (zmierzone: 3 repliki po 2x4
      # dawaly 2,5x mniejsza przepustowosc niz jedna). Skalowanie poziome ma sens na osobnych maszynach.
      - TORCH_THREADS=${TORCH_THREADS:-4}
      - PI_WORKERS=${PI_WORKERS:-2}
      - PYTHONUNBUFFERED=1
    # Jawny healthcheck (taki sam jak w Dockerfile). `semantic-lb` czeka na `service_healthy`,
    # wiec zaleznosc jest widoczna w compose, a nie tylko odziedziczona z obrazu.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    depends_on:
      mock-llm:
        condition: service_healthy
    <<: *service

  # Load balancer przed replikami. Dziedziczy nazwe `semantic-service`, wiec brama,
  # testy i skrypty dalej mowia do `semantic-service:8001` - zmiana jest po naszej stronie.
  semantic-lb:
    mem_limit: 256m
    image: nginx:1.30-alpine
    container_name: noorpointer-semantic-lb
    ports:
      - "8001:8001" # HTTP: skany, /metrics, /readyz
      - "50051:50051" # gRPC dla bramy
    volumes:
      - ./telemetry/nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./telemetry/nginx-lb/conf.d:/etc/nginx/conf.d:ro,z
      - ./telemetry/nginx-lb/stream.d:/etc/nginx/stream.d:ro,z
    networks:
      noorpointer-net:
        aliases:
          - semantic-service
    healthcheck:
      # 127.0.0.1, nie localhost: BusyBox wget potrafi wybrac ::1, a nginx nasluchuje tylko IPv4
      # (0.0.0.0:8001) - wtedy healthcheck jest wiecznie "unhealthy", choc LB dziala.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8001/lb-healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      semantic-app:
        condition: service_healthy
    <<: *service

  # ========================================================
  # CONTROL PLANE (Policy Catalog, PostgreSQL Audit, SIEM CEF Export & Dashboard API)
  # ========================================================
  controlplane:
    mem_limit: 2g
    build:
      context: .
      dockerfile: controlplane/Dockerfile
    container_name: noorpointer-controlplane
    ports:
      - "8082:8082" # REST API /api/v1
    environment:
      - PORT=8082
      - SERVER_ADDRESS=0.0.0.0
      - DATABASE_URL=jdbc:postgresql://postgres:5432/noorpointer?currentSchema=controlplane
      - DATABASE_USER=noor
      - DATABASE_PASSWORD=noorpass
      - GATEWAY_URL=http://gateway:8080
      - SPRING_FLYWAY_SCHEMAS=controlplane
      - SPRING_FLYWAY_DEFAULT_SCHEMA=controlplane
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - DEMO_ENABLED=${DEMO_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      signatures-feed:
        condition: service_started
    <<: *service

  # ========================================================
  # MANAGEMENT & SECURITY DASHBOARD (React + Vite + Nginx API proxy)
  # ========================================================
  dashboard:
    mem_limit: 256m
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: noorpointer-dashboard
    ports:
      - "3000:3000"
    depends_on:
      controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *service

  # ========================================================
  # THREAT INTELLIGENCE FEED (External CVEs / Signatures)
  # ========================================================
  signatures-feed:
    mem_limit: 128m
    image: nginx:1.30-alpine
    container_name: noorpointer-signatures-feed
    ports:
      - "8085:8085"
    volumes:
      - ./signatures-feed:/usr/share/nginx/html:ro,z
      - ./signatures-feed/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/signatures.json"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    <<: *service

  # ========================================================
  # INFRASTRUCTURE STORAGE (PostgreSQL 16 JSONB & Redis 7 Token Bucket)
  # ========================================================
  postgres:
    mem_limit: 1g
    image: postgres:16-alpine
    container_name: noorpointer-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: noor
      POSTGRES_PASSWORD: noorpass
      POSTGRES_DB: noorpointer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noor -d noorpointer"]
      interval: 3s
      timeout: 3s
      retries: 5
    <<: *service

  redis:
    mem_limit: 256m
    image: redis:7-alpine
    container_name: noorpointer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    <<: *service

  # ========================================================
  # MOCK LLM UPSTREAM (OpenAI- + Ollama-compatible, zero deps)
  # Swap for real Ollama/OpenAI later via UPSTREAM_LLM_URL / OLLAMA_URL.
  # ========================================================
  mock-llm:
    mem_limit: 512m
    build:
      context: ./mock-llm
      dockerfile: Dockerfile
    container_name: noorpointer-mock-llm
    ports:
      - "11434:11434" # drop-in for the old ollama port (curl debugging)
    <<: *service

  # ========================================================
  # TELEMETRY & OBSERVABILITY (Prometheus & Grafana)
  # ========================================================
  prometheus:
    mem_limit: 512m
    image: prom/prometheus:v2.54.1
    container_name: noorpointer-prometheus
    ports:
      - "9091:9090" # Zewnętrzny 9091 (unikamy konfliktu z gateway:9090)
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./telemetry/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro,z
      # Token ADMIN_TOKEN jako plik, zeby nie trzymac go na sztywno w prometheus.yml.
      # Generuje go `make prometheus-token` (wola je `make up` / `make dev-infra`).
      - ./telemetry/.prometheus-admin-token:/etc/prometheus/admin_token:ro,z
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Pozwala przeladowac reguly bez restartu kontenera: curl -X POST localhost:9091/-/reload
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    <<: *service

  grafana:
    mem_limit: 512m
    image: grafana/grafana:11.1.0
    container_name: noorpointer-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus
    <<: *service

  # ========================================================
  # EVALUATION & AUTOMATION PROFILES (Tests & Benchmarks)
  # ========================================================
  tests:
    mem_limit: 512m
    build:
      context: ./tests
      dockerfile: Dockerfile
    environment:
      - GATEWAY_URL=http://gateway:8080
      - CONTROLPLANE_URL=http://controlplane:8082
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-dev-admin}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-local-dev-gateway}
      - SEMANTIC_URL=http://semantic-service:8001
    volumes:
      # Kod testow jest montowany rownolegle do kopii w obrazie, zeby zmiany w pliku testow
      # dzialaly bez przebudowy obrazu. Zmiany w requirements.txt nadal wymagaja: make test-rebuild.
      - ./tests/test_guardrails.py:/app/test_guardrails.py:ro,z
      - ./reports:/app/reports:z
    profiles:
      - tests
    networks: [noorpointer-net]

  benchmarks:
    mem_limit: 512m
    image: grafana/k6:2.3.0
    volumes:
      - ./benchmarks:/benchmarks:z
      - ./reports:/reports:z
    environment:
      - TARGET_URL=http://gateway:8080
    profiles:
      - bench
    networks: [noorpointer-net]

  # Testy modulu Java. Uruchamiamy je w obrazie uzywanym do budowy control plane (etap `build` ma juz
  # pobrane zaleznosci Mavena, wiec nie trzeba instalowac Javy na hoscie). Baza testowa pochodzi
  # z `make postgres-test-up`: postgres-test-up tworzy ja, ten serwis tylko sie do niej podlacza.
  # Testy modulu semantycznego (117 przypadkow). Obraz jest produkcyjny, bez zaleznosci deweloperskich,
  # wiec dokladamy grupe "dev" (pytest) i montujemy katalog testow z repozytorium - testujemy dokladnie
  # ten kod, ktory jest w repo. Testy z markerem "models" sa domyslnie pomijane (wymagaja pobrania modeli).
  semantic-tests:
    mem_limit: 4g
    build:
      context: ./semantic-service
      dockerfile: Dockerfile
    working_dir: /app
    # Obraz semantyki chodzi jako uzytkownik `semantic` (non-root). Ten serwis testowy instaluje
    # zaleznosci deweloperskie do /app/.venv, ktore nalezy do roota, wiec swiadomie wracamy tu do roota.
    user: root
    volumes:
      - ./semantic-service/tests:/app/tests:ro,z
    environment:
      - MODELS_OFFLINE=1
      - OLLAMA_URL=http://mock-llm:11434
      - GUARD_MODEL=llama-guard3:1b
      - PYTHONUNBUFFERED=1
    command:
      - sh
      - -c
      - uv sync --frozen --dev --no-install-project && python -m pytest tests -q --tb=no
    depends_on:
      mock-llm:
        condition: service_healthy
    profiles:
      - semantic
    networks: [noorpointer-net]

  controlplane-tests:
    mem_limit: 2g
    build:
      context: .
      dockerfile: controlplane/Dockerfile
      target: build
    working_dir: /workspace
    command:
      - mvn
      - -B
      - -ntp
      - -f
      - controlplane/pom.xml
      - test
      - -Dfrontend.skip=true
    environment:
      - TEST_DATABASE_URL=jdbc:postgresql://postgres:5432/noorpointer_test?currentSchema=controlplane_test
      - TEST_DATABASE_USER=noor
      - TEST_DATABASE_PASSWORD=noorpass
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - java
    networks: [noorpointer-net]

networks:
  noorpointer-net:
    driver: bridge

volumes:
  postgres-data:
