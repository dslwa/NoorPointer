server {
    listen 3000;
    server_name localhost;

    location /api/ {
        proxy_pass http://controlplane:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Java authenticates the panel token and forwards to the Go admin endpoint.
    location = /gateway/check {
        proxy_pass http://controlplane:8082/gateway/check;
        client_max_body_size 1m;
        proxy_read_timeout 25s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
