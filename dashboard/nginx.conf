server {
    listen 3000;
    server_name localhost;

    location /api/ {
        proxy_pass http://controlplane:8082;
        # $http_host (nie $host) zachowuje port w naglowku Host, wiec ewentualne absolutne
        # przekierowania z control plane wskazuja na :3000, a nie na :80.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
