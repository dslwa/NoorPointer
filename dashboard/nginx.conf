server {
    listen 3000;
    server_name localhost;

    location /api/ {
        proxy_pass http://controlplane:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Prompt check page: only the scan and readiness routes of the semantic service, not model scanning.
    location = /semantic/v1/scan {
        proxy_pass http://semantic-service:8001/v1/scan;
        proxy_read_timeout 35s;
        client_max_body_size 4m;
    }

    location = /semantic/readyz {
        proxy_pass http://semantic-service:8001/readyz;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
