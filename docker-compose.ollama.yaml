# Dodatek do docker-compose.yaml: zamienia zastepczy model na prawdziwa Ollame.
# Uruchomienie: make ollama-up (najpierw pobiera modele).
services:
  ollama:
    image: ollama/ollama:0.35.1
    # Dwa modele zajmuja ok. 3-4 GB; 10g zostawia zapas i chroni komputer, gdy model sie rozjedzie.
    mem_limit: 10g
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Ten plik nie korzysta ze wspolnego bloku, wiec rotacje logow ustawiamy tutaj osobno.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - noorpointer-net

  gateway:
    environment:
      - UPSTREAM_LLM_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # Nazwa musi byc "semantic-app" - tak nazywa sie usluga w docker-compose.yaml.
  # Wpis "semantic-service" tworzyl nowa usluge bez obrazu i psul make ollama-up.
  semantic-app:
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-data:
