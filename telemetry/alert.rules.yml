groups:
  - name: noorpointer
    rules:
      # Dostepnosc uslug
      - alert: GatewayDown
        # Na razie nie ma danych: gateway nie wystawia /metrics (patrz prometheus.yml).
        expr: up{job="noorpointer-gateway"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Brak odpowiedzi z gatewaya"
          description: "Prometheus nie moze pobrac metryk z gateway:9090/metrics (endpoint nie istnieje albo proces nie dziala)."

      - alert: SemanticDown
        # "max(...) == 0" znaczy: zaden z kontenerow uslugi AI nie odpowiada (calkowita awaria).
        # Czekamy 2 minuty, bo na starcie usluga wczytuje modele (ok. 2 min).
        expr: max(up{job="noorpointer-semantic"}) == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Zadna kopia uslugi AI nie odpowiada"
          description: "Prometheus nie moze pobrac metryk z zadnej kopii od ponad 2 minut."

      - alert: SemanticReplicaLost
        # Czesciowa awaria: czesc kopii dziala, czesc nie - ruch idzie, ale zapas sie zmniejszyl.
        expr: min(up{job="noorpointer-semantic"}) == 0 and max(up{job="noorpointer-semantic"}) == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Czesc kopii uslugi AI nie odpowiada"
          description: "Przynajmniej jedna kopia dziala, a przynajmniej jedna nie odpowiada."

      - alert: ControlPlaneDown
        expr: up{job="noorpointer-controlplane"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Brak odpowiedzi z control plane lub blad tokenu metryk"

      # Jakosc kontroli AI (prog: 200 ms)
      - alert: SemanticSlow
        # Okno 5 minut, bo przy malym ruchu p95 z jednej minuty skacze.
        expr: histogram_quantile(0.95, sum(rate(semantic_check_latency_seconds_bucket[5m])) by (le)) > 0.2
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "p95 kontroli AI powyzej 200 ms"
          description: "Limit z polityki to 8000 ms, wiec alert ostrzega, zanim zblizymy sie do limitu."

      - alert: SemanticCheckFailing
        expr: sum(rate(semantic_check_latency_seconds_count{status=~"error|timeout"}[1m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Kontrole AI konczace sie bledem lub przekroczeniem czasu"

      # Plaszczyzna danych (zadziala po dodaniu /metrics w gatewayu)
      - alert: GatewayBlockSpike
        # Etykieta "block" musi sie zgadzac z nazwa akcji w metryce gatewaya (allow|block|redact|monitor|timeout).
        expr: sum(rate(gateway_requests_total{action="block"}[1m])) > 5
        for: 1m
        labels: { severity: info }
        annotations:
          summary: "Skok liczby zablokowanych zadan (ponad 5 na sekunde)"
          description: "Przy normalnej pracy to sygnal ataku. Sprawdz, czy to nie falszywy alarm."

      # Brak danych (metryka nie istnieje albo nie ma ruchu)
      - alert: SemanticNoTraffic
        # Warunek "jest ruch w gatewayu" jest po to, zeby alert nie wyzwalal sie w nocy, gdy nikt nie pracuje.
        expr: sum(rate(gateway_requests_total[5m])) > 0 and sum(increase(semantic_check_latency_seconds_count[5m])) == 0
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "Gateway ma ruch, a usluga AI nie wykonuje kontroli"
          description: "Przez 10 minut byly zadania, a licznik kontroli sie nie zmienil - sprawdzanie tresci nie jest podlaczone do sciezki zadania."

      - alert: GatewayMetricsMissing
        # Alert jest prawdziwy, dopoki gateway nie wystawia /metrics. Zniknie sam po dodaniu metryki.
        expr: absent(gateway_requests_total)
        for: 5m
        labels: { severity: info }
        annotations:
          summary: "Gateway nie wystawia metryk"
          description: "Brak serii gateway_requests_total. Po dodaniu /metrics odkomentuj zadanie w prometheus.yml."
