groups:
  - name: noorpointer
    rules:
      # --- availability ----------------------------------------------------------------------------------
      # NOTE: the gateway scrape job in prometheus.yml is commented out until the gateway ships
      # /metrics. With no target there is no up{} series, so this alert is inert instead of firing a
      # red critical during the jury demo. Re-enable the job and this rule together.
      - alert: GatewayDown
        expr: up{job="noorpointer-gateway"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Gateway metrics endpoint down"
          description: "Prometheus cannot scrape gateway:9090/metrics (missing or crashed)."

      - alert: SemanticDown
        expr: up{job="noorpointer-semantic"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Semantic service down"

      - alert: ControlPlaneDown
        expr: up{job="noorpointer-controlplane"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Control plane down (or metrics auth broke)"

      # --- semantic guardrails (SLA 200 ms, fail-closed) ---------------------------------------------------
      - alert: SemanticSlow
        expr: histogram_quantile(0.95, sum(rate(semantic_check_latency_seconds_bucket[1m])) by (le)) > 0.2
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Semantic p95 above 200 ms SLA"

      - alert: SemanticCheckFailing
        expr: sum(rate(semantic_check_latency_seconds_count{status=~"error|timeout"}[1m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Semantic checks erroring/timing out (gateway falls back per on_timeout policy)"

      # --- data plane (comes alive once the gateway exposes /metrics) --------------------------------------
      - alert: GatewayBlockSpike
        expr: sum(rate(gateway_requests_total{action="blocked"}[1m])) > 5
        for: 1m
        labels: { severity: info }
        annotations:
          summary: "Blocked requests spike (>5/s)"

      # --- "we don't know" signals ------------------------------------------------------------------------
      # An absent metric and a metric that never fires look identical in the alert list (both inactive).
      # These two make the silent-gap case explicit.
      - alert: SemanticNoTraffic
        # Counter exists (exported by prometheus_client) but nothing increased it: service up, no scans.
        expr: sum(increase(semantic_check_latency_seconds_count[5m])) == 0
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "Semantic gets no traffic"
          description: "Semantic is scrapeable but no check ran in the last 5m - is the gateway calling /v1/scan?"

      - alert: GatewayMetricsMissing
        # Fires because the metric does not exist at all: the gateway has no /metrics yet (known gap).
        # It goes inactive by itself the moment the gateway exposes gateway_requests_total.
        expr: absent(gateway_requests_total)
        for: 5m
        labels: { severity: info }
        annotations:
          summary: "Gateway exposes no /metrics (known gap)"
          description: "No gateway_requests_total series; re-enable the scrape job in prometheus.yml once /metrics exists."

