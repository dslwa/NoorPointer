# Konfiguracja load balancera uslugi AI.
# Po co wlasny nginx: sam Docker DNS nie rozklada ruchu (klient trzyma jedno polaczenie z jedna kopia).
# Tutaj nginx pyta DNS przy kazdym zadaniu, wiec ruch idzie do wszystkich kopii. Dodatkowo obslugujemy gRPC.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    off;
    sendfile      on;
    keepalive_timeout  65;

    # 127.0.0.11 to serwer DNS Dockera; valid=5s sprawia, ze nowe kopie widac po 5 sekundach.
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/stream.d/*.conf;
}
