# Konfiguracja load balancera uslugi semantycznej.
#
# Dlaczego wlasny nginx, a nie samo `--scale`:
#   Docker DNS zwraca adresy wszystkich replik, ale klient HTTP (nasz gateway, nginx panelu, skrypty)
#   rozwiazuje nazwe raz i trzyma jedno polaczenie z jedna replika. Podniesienie liczby replik
#   nic by wtedy nie dalo. Ten nginx rozwiazuje nazwe przy kazdym zadaniu (resolver Dockera)
#   i rozklada ruch po replikach.
#
# Ten plik nadpisuje domyslny nginx.conf obrazu, bo potrzebujemy sekcji `stream` (gRPC).

user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    off;
    sendfile      on;
    keepalive_timeout  65;

    # 127.0.0.11 to wbudowany serwer DNS Dockera: zwraca adresy wszystkich replik uslugi.
    # valid=5s sprawia, ze po zmianie liczby replik ruch trafia do nowych kontenerow w ciagu 5 sekund.
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/stream.d/*.conf;
}
