# gRPC (:50051) - trasa uzywana przez brame. To zwykle przekazanie TCP: kazde nowe polaczenie
# trafia do kolejnej kopii. Jedna sesja gRPC trzyma sie jednej kopii, ale rozkladaja sie sesje.

server {
    listen 50051;
    set $semantic_grpc semantic-app:50051;
    proxy_pass $semantic_grpc;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
}
