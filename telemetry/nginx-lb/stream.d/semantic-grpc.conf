# gRPC (:50051) - trasa uzywana przez brame.
#
# To zwykle przekazanie TCP: kazde nowe polaczenie gRPC trafia do kolejnej repliki.
# Uwaga uczciwie: klient gRPC multipleksuje wiele wywolan w jednym polaczeniu, wiec jedna
# sesja klienta pracuje z jedna replika. Rownolegle sesje rozkladaja sie na wszystkie repliki.

server {
    listen 50051;
    set $semantic_grpc semantic-app:50051;
    proxy_pass $semantic_grpc;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
}
