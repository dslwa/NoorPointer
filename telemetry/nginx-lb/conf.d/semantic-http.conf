# HTTP (:8001) - po tym porcie pytaja: brama, panel, testy i pomiary.
# Adres jest zmienna (nie staly), zeby nginx pytal DNS o kopie przy kazdym zadaniu.

server {
    listen 8001;
    client_max_body_size 8m;

    # Zdrowie load balancera. Nie pytamy tu kopii, bo na starcie odpowiadaja 503 (wczytuja modele),
    # a sam load balancer dziala. Zdrowie kopii pilnuje Prometheus.
    location = /lb-healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $semantic_http semantic-app:8001;
        proxy_pass http://$semantic_http;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Naglowek Host z portem - inaczej przekierowania aplikacji (np. /metrics) gubia ":8001".
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Gdy kopia padnie, nginx pyta DNS ponownie i wybiera inna.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
