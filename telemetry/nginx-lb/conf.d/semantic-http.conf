# HTTP (:8001) - to po tym porcie rozmawiaja: brama, panel (strona "Prompt check"),
# testy e2e, skrypty i pomiar przepustowosci.
#
# proxy_pass ze zmienna (a nie stalym adresem) jest tu celowe: nginx musi pytac Dockera o adresy
# przy kazdym zadaniu, inaczej wybierze jedna replike przy starcie i zostanie z nia na zawsze.

server {
    listen 8001;
    client_max_body_size 8m;

    location / {
        set $semantic_http semantic-app:8001;
        proxy_pass http://$semantic_http;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Gdy replika padnie w trakcie, nginx pyta DNS ponownie i wybiera inny adres.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
