global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # Zadanie dla gatewaya jest wylaczone, dopoki gateway nie wystawi GET /metrics na porcie 9090.
  # Bez tego celu nie da sie zmierzyc narzutu, a alert GatewayDown nie ma danych.
  # Po dodaniu endpointu odkomentuj ponizszy blok.
  # - job_name: "noorpointer-gateway"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["gateway:9090"]
  #       labels:
  #         component: "gateway"
  #         tier: "data-plane"

  # Usluga semantyczna dziala w replikach, wiec nie wpisujemy adresu na sztywno: Prometheus pyta
  # Dockera o wszystkie adresy pod nazwa `semantic-app` i zbiera metryki z kazdej repliki osobno.
  # Dzieki temu wykresy pokazuja sume ruchu, a nie tylko to, co trafilo do jednego kontenera.
  - job_name: "noorpointer-semantic"
    # Z ukonczeniem "/": FastAPI montuje /metrics jako podaplikacje ASGI, wiec bez ukosnika odpowiada
    # 307, a nginx przekazuje Host bez portu. Prometheus idzie za redirectem na :80 i cel jest "down"
    # (falszywy alert SemanticDown). Sprawdzone na dzialajacym stosie: /metrics -> 307, /metrics/ -> 200.
    metrics_path: /metrics/
    dns_sd_configs:
      - names: ["semantic-app"]
        type: A
        port: 8001
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: component
        replacement: "semantic-service"
      - target_label: tier
        replacement: "ai-guardrails"

  - job_name: "noorpointer-controlplane"
    metrics_path: /actuator/prometheus
    # Endpoint /actuator/prometheus wymaga roli administratora, dlatego wysylamy token w naglowku.
    # Wartosc jest wpisana na stale, bo prom/prometheus:v2.54.1 nie obsluguje flagi --config.expand-env
    # i podstawienie ${ADMIN_TOKEN} zostaloby potraktowane doslownie. Przy zmianie ADMIN_TOKEN popraw oba miejsca.
    authorization:
      type: Bearer
      credentials: local-dev-admin
    static_configs:
      - targets: ["controlplane:8082"]
        labels:
          component: "controlplane"
          tier: "management-plane"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
