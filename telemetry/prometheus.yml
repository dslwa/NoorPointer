global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: "noorpointer-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          component: "gateway"
          tier: "data-plane"

  - job_name: "noorpointer-semantic"
    metrics_path: /metrics
    static_configs:
      - targets: ["semantic-service:8001"]
        labels:
          component: "semantic-service"
          tier: "ai-guardrails"

  - job_name: "noorpointer-controlplane"
    metrics_path: /actuator/prometheus
    # /actuator/prometheus is ADMIN-only (SecurityConfig), so send the admin bearer token.
    # Hardcoded to the compose default on purpose: prom/prometheus:v2.54.1 has no
    # --config.expand-env, so ${ADMIN_TOKEN} would be used literally. Keep in sync if you change it.
    authorization:
      type: Bearer
      credentials: local-dev-admin
    static_configs:
      - targets: ["controlplane:8082"]
        labels:
          component: "controlplane"
          tier: "management-plane"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
