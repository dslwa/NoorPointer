global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # Gateway nie wystawia jeszcze /metrics, wiec nie ma go na liscie celow. Po dodaniu endpointu
  # wystarczy odkomentowac ponizsze linie.
  # - job_name: "noorpointer-gateway"
  #   metrics_path: /metrics
  #   static_configs: [{ targets: ["gateway:9090"], labels: { component: "gateway", tier: "data-plane" } }]

  # Usluga AI dziala w kilku kopiach, wiec pytamy Dockera o wszystkie adresy pod nazwa
  # "semantic-app" - kazda kopia to osobny cel na wykresach.
  - job_name: "noorpointer-semantic"
    # Koncowe "/" jest konieczne: bez niego FastAPI odpowiada 307 i Prometheus uznaje cel za "down".
    metrics_path: /metrics/
    dns_sd_configs:
      - names: ["semantic-app"]
        type: A
        port: 8001
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: component
        replacement: "semantic-service"
      - target_label: tier
        replacement: "ai-guardrails"

  - job_name: "noorpointer-controlplane"
    metrics_path: /actuator/prometheus
    # Ten endpoint wymaga tokenu administratora, wiec wysylamy go w naglowku.
    # Token lezy w osobnym pliku (robi go `make up`), a nie na sztywno w tym pliku.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/admin_token
    static_configs:
      - targets: ["controlplane:8082"]
        labels:
          component: "controlplane"
          tier: "management-plane"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
