syntax = "proto3";

package guardrails.v1;

option go_package = "github.com/dslwa/NoorPointer/gateway/proto/v1;guardrailspb";

service GuardrailService {
  // Szybka analiza promptu wejściowego użytkownika/agenta
  rpc ScanPrompt (PromptScanRequest) returns (PromptScanResponse);

  // Analiza odpowiedzi wygenerowanej przez LLM (wyciek sekretów / promptu systemowego)
  rpc ScanOutput (OutputScanRequest) returns (OutputScanResponse);

  // Skanowanie plików wag modeli (detekcja pickle RCE / unsafe deserialization)
  rpc ScanModel (ModelScanRequest) returns (ModelScanResponse);
}

message PromptScanRequest {
  string request_id = 1;
  string agent_id = 2;
  string prompt = 3;
  double injection_threshold = 4; // np. 0.85
  bool check_pii = 5;
}

message PromptScanResponse {
  bool is_injection = 1;
  double injection_score = 2; // 0.0 do 1.0
  repeated PiiEntity pii_detected = 3;
  string sanitized_prompt = 4; // Tekst po zredagowaniu encji PII
  string recommended_action = 5; // "allow" | "block" | "redact"
  string reason = 6;
  int64 latency_ms = 7;
}

message PiiEntity {
  string entity_type = 1; // PERSON, EMAIL, PESEL, MEDICAL, etc.
  string text = 2;
  int32 start = 3;
  int32 end = 4;
  double score = 5;
}

message OutputScanRequest {
  string request_id = 1;
  string output_text = 2;
  string system_prompt = 3;
}

message OutputScanResponse {
  bool policy_violation = 1;
  string reason = 2;
  string sanitized_output = 3;
}

message ModelScanRequest {
  string file_path = 1;
  bytes file_header = 2;
}

message ModelScanResponse {
  bool is_safe = 1;
  repeated string dangerous_opcodes = 2;
  string description = 3;
}
