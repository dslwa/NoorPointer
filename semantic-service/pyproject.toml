[project]
name = "semantic-service"
version = "0.1.0"
description = "Semantic AI security checks (prompt injection, content safety, PII, leakage, model scanning) for the AgentGate gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "torch>=2.4",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "huggingface-hub>=0.24",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "en-core-web-lg",
    "pl-core-news-lg",
    "grpcio>=1.84.0",
    "picklescan[7z]>=1.0.5",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
pl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/pl_core_news_lg-3.8.0/pl_core_news_lg-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "models: tests that load real ML models (slow, need downloads)",
    "ollama: requires real Ollama with GUARD_MODEL installed (not mock-llm)",
]
addopts = "-m 'not models'"
